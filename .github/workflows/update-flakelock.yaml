name: "Update flake.lock"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 3"  # Wednesdays at 08:00 UTC

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Update flakes/xmage flake.lock
        run: |
          nix flake update --flake ./flakes/xmage
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flakes/xmage/flake.lock
          git diff --staged --quiet || git commit -m "flakes/xmage flake.lock: Update"

      - uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          pr-title: "Update flake.lock"
          pr-labels: dependencies

      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
