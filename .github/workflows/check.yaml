name: Nix Flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Check Nix formatting
        run: |
          nix run nixpkgs#nixfmt -- --check $(find . -name '*.nix' ! -path './nixos/hardware/*')

  flake-check:
    runs-on: ubuntu-latest
    needs: nix-format-check
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://attic.cluster.diluz.io/nix
            extra-trusted-public-keys = nix:cBtilShOB836/+8B2n16OYO6RWg42SVWiUloOgvpLx8=

      - name: Check flake
        run: nix flake check --all-systems --no-build

      - name: Show flake metadata
        run: nix flake metadata

      - name: Show flake outputs
        run: nix flake show

  # Build all configurations
  build:
    runs-on: ${{ matrix.os }}
    needs: flake-check
    timeout-minutes: ${{ matrix.platform == 'darwin' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: nixos
            platform: nixos
            os: ubuntu-latest
          - config: Big-M1ac
            platform: darwin
            os: macos-latest
          - config: Sebastian-Di-Luzio-MacBook-Pro-MBP-L1682
            platform: darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Free up disk space (Linux only)
        if: matrix.platform == 'nixos'
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://attic.cluster.diluz.io/nix
            extra-trusted-public-keys = nix:cBtilShOB836/+8B2n16OYO6RWg42SVWiUloOgvpLx8=

      - name: Build ${{ matrix.platform }} configuration - ${{ matrix.config }}
        run: |
          if [ "${{ matrix.platform }}" = "nixos" ]; then
            ATTR="nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel"
          else
            ATTR="darwinConfigurations.${{ matrix.config }}.system"
          fi

          nix build .#$ATTR \
            --print-build-logs \
            --fallback \
            --no-link \
            --print-out-paths > out-path.txt

      - name: Push new build outputs to attic cache
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          # If the secret is missing (e.g. PR from a fork), exit early and gracefully
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "ATTIC_TOKEN is empty, skipping attic cache push."
            exit 0
          fi
          nix profile add nixpkgs#attic-client
          attic login nix https://attic.cluster.diluz.io "$ATTIC_TOKEN"

          # Only push paths cache.nixos.org doesn't already have, no point duplicating them into our own cache.
          nix-store -qR "$(cat out-path.txt)" | while read -r p; do
            hash="$(basename "$p" | cut -d- -f1)"
            if ! curl -sf -o /dev/null "https://cache.nixos.org/${hash}.narinfo"; then
              echo "$p"
            fi
          done > missing-paths.txt

          if [ -s missing-paths.txt ]; then
            attic push nix $(cat missing-paths.txt)
          else
            echo "Nothing new to push"
          fi

  # Final check that all builds succeeded
  # This allows us to set required status checks on GitHub a lot more "flexible"
  all-builds-complete:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Fail if any build failed
        if: needs.build.result != 'success'
        run: exit 1
