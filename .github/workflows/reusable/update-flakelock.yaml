name: "Update flake.lock"

on:
  workflow_call:
    inputs:
      flake-path:
        required: true
        type: string

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Generate branch name
        id: branch
        run: |
          SANITIZED=$(echo "${{ inputs.flake-path }}" | sed 's|^\./||' | sed 's|[^a-zA-Z0-9]|_|g')
          echo "name=update_flake_lock_${SANITIZED}" >> $GITHUB_OUTPUT

      - uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          path-to-flake-dir: ${{ inputs.flake-path }}
          branch: ${{ steps.branch.outputs.name }}
          pr-title: "Update flake.lock (${{ inputs.flake-path }})"
          pr-labels: dependencies
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
