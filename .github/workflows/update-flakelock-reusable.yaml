name: "Update flake.lock (reusable)"

on:
  workflow_call:
    inputs:
      inputs-to-update:
        description: "Space-separated list of flake inputs to update"
        required: true
        type: string
      branch:
        description: "Branch name for the update PR"
        required: true
        type: string
      pr-title:
        description: "Title for the update PR"
        required: true
        type: string

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          inputs: ${{ inputs.inputs-to-update }}
          branch: ${{ inputs.branch }}
          pr-title: ${{ inputs.pr-title }}
          pr-labels: dependencies

      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
