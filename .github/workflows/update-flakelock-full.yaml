name: "Update flake.lock (full)"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 2"  # Tuesdays at 07:00 UTC, shortly after upstream nixpkgs-weekly release (~05:00 UTC)

jobs:
  update-flake-lock:
    uses: ./.github/workflows/update-flakelock-reusable.yaml
    permissions:
      contents: write
      pull-requests: write
    with:
      variant: full
