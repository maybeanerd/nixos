name: Nix Flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Check Nix formatting
        run: |
          nix run nixpkgs#nixfmt-rfc-style -- --check $(find . -name '*.nix' ! -name 'hardware-configuration.nix')

  flake-check:
    runs-on: ubuntu-latest
    needs: nix-format-check
    strategy:
      fail-fast: false
      matrix:
        flake:
          - name: root
            path: .
          - name: xmage
            path: flakes/xmage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Check ${{ matrix.flake.name }} flake
        working-directory: ${{ matrix.flake.path }}
        run: nix flake check --all-systems --no-build

      - name: Show ${{ matrix.flake.name }} flake metadata
        working-directory: ${{ matrix.flake.path }}
        run: nix flake metadata

      - name: Show ${{ matrix.flake.name }} flake outputs
        working-directory: ${{ matrix.flake.path }}
        run: nix flake show

  # Build packages from flakes/ directory (with Cachix)
  flakes-build:
    runs-on: ${{ matrix.os }}
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # xmage
          - flake: xmage
            system: x86_64-linux
            os: ubuntu-latest
          - flake: xmage
            system: aarch64-darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: maybeanerd
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.flake }} for ${{ matrix.system }}
        working-directory: ./flakes/${{ matrix.flake }}
        run: |
          nix build .#packages.${{ matrix.system }}.default \
            --print-build-logs \
            --fallback

  # Build all configurations
  build:
    runs-on: ${{ matrix.os }}
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: nixos
            platform: nixos
            os: ubuntu-latest
          - config: Big-M1ac
            platform: darwin
            os: macos-latest
          - config: MacBook-Pro-MBP-L1682
            platform: darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free up disk space (Linux only)
        if: matrix.platform == 'nixos'
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Build ${{ matrix.platform }} configuration - ${{ matrix.config }}
        run: |
          if [ "${{ matrix.platform }}" = "nixos" ]; then
            ATTR="nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel"
          else
            ATTR="darwinConfigurations.${{ matrix.config }}.system"
          fi

          nix build .#$ATTR \
            --print-build-logs \
            --fallback

  # Final check that all builds succeeded
  # This allows us to set required status checks on GitHub a lot more "flexible"
  all-builds-complete:
    runs-on: ubuntu-latest
    needs: [build, flakes-build]
    if: always()
    steps:
      - name: Check all builds succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.flakes-build.result }}" != "success" ]; then
            echo "One or more builds failed"
            exit 1
          fi
          echo "All builds completed successfully"
